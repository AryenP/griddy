name: ci
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Install (no Mac extras; torch-only tests skip)
        run: |
          uv venv --python 3.11
          uv pip install -e ".[dev]"
      - name: Tests
        run: uv run pytest -q
      - name: No fabricated data in runtime code
        run: uv run python scripts/check_runtime.py
      - name: Branch only touches its owner's files
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: uv run python scripts/team.py check --branch "$HEAD_REF" --base origin/main
