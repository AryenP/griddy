<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Griddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="world.css">
  <link rel="stylesheet" href="chrome.css">
  <script src="common.js"></script>
  <script src="seen.js"></script>
</head>
<body class="w">
  <div id="w-load" class="w-load" role="status" aria-label="Griddy is loading">
    <svg class="w-load-mark" viewBox="0 0 120 120" aria-hidden="true">
      <path class="g-trace" pathLength="1" d="M96 30H30V90H90V62H64"/>
      <path class="g-pulse" pathLength="1" d="M96 30H30V90H90V62H64"/>
      <g class="g-nodes"><circle cx="96" cy="30" r="3.6"/><circle cx="30" cy="30" r="3.6"/><circle cx="90" cy="90" r="3.6"/><circle cx="90" cy="62" r="3.6"/><circle cx="64" cy="62" r="3.6"/></g>
      <circle class="g-fault" cx="30" cy="90" r="4.6"/>
      <circle class="g-ring" cx="30" cy="90" r="4.6"/>
    </svg>
    <div class="w-load-word"><b>Griddy</b><span>the grid's shock absorber</span></div>
  </div>
  <header class="w-top g-top">
    <a class="g-brand" href="/" aria-label="Griddy home"><svg class="g-mark" viewBox="0 0 120 120" aria-hidden="true"><path d="M96 30H30V90H90V62H64"/><circle cx="30" cy="90" r="9"/></svg><b>Griddy</b></a>
    <nav class="g-nav" aria-label="Pages"><a href="/" aria-current="page">Grid</a><a href="/info.html">Info</a><a href="/proof.html">Proof</a></nav>
    <div class="g-status"><span id="w-feed" class="badge">grid feed</span><span id="conn" class="badge">connecting</span></div>
  </header>

  <canvas id="world" class="w-world" role="img" aria-label="The grid as a 3D world: power plants from the real fuel mix, the city lit by the demand served, this Mac's data center by its measured watts"></canvas>
  <div id="w-alerts" class="w-toasts" aria-live="polite"></div>
  <button id="w-back" type="button" class="w-back" hidden>← Back to the grid</button>
  <div id="w-pop" class="w-pop" role="dialog" aria-labelledby="w-pop-t" hidden>
    <b id="w-pop-t"></b><p id="w-pop-p"></p>
    <form id="w-pop-f" class="w-pop-f" hidden>
      <label for="w-pop-in">Or say how it breaks, in your words</label>
      <div><input id="w-pop-in" maxlength="500" autocomplete="off" placeholder="e.g. an ice storm freezes half the gas wellheads"><button type="submit">Read it</button></div>
      <small id="w-pop-read" aria-live="polite"></small>
    </form>
    <div id="w-pop-b" class="w-pop-b"></div>
  </div>

  <section class="w-dock" aria-label="The demo">
    <div class="w-row">
      <div id="w-picks" class="w-events" role="group" aria-label="Choose what the grid shows"></div>
      <button id="w-break-btn" type="button" class="w-work w-break">Break a part</button>
      <button id="w-work-btn" type="button" class="w-work" hidden>Give training a deadline</button>
      <button id="w-play-btn" type="button" class="w-play">Replay it live</button>
    </div>
    <div class="w-row w-row-time">
      <span id="w-clock" class="w-when">Live</span>
      <div class="w-bar" aria-hidden="true"><i id="w-progress"></i></div>
      <span id="w-head" class="w-headline"></span>
    </div>
    <div id="w-versus" class="w-versus" hidden>
      <div class="w-vs w-vs-without"><b>Without Griddy</b><span id="w-without"></span><small id="w-without-src"></small></div>
      <div class="w-vs w-vs-with"><b>With Griddy</b><span id="w-with"></span><small id="w-with-src"></small></div>
    </div>
    <div class="w-stats">
      <div class="w-stat"><b id="s-served">—</b><span>served</span><small id="s-served-src"></small></div>
      <div class="w-stat"><b id="s-needed">—</b><span>needed</span><small id="s-needed-src"></small></div>
      <div class="w-stat"><b id="s-mac">—</b><span>this Mac</span><small id="s-mac-src">measured by powermetrics</small></div>
      <div class="w-stat"><b id="s-impact">—</b><span id="s-impact-k">at grid scale</span><small id="s-impact-src">estimate</small></div>
    </div>
  </section>
  <footer id="w-sources" class="w-src"></footer>

  <script src="world.js"></script>
  <script src="demo.js"></script>
</body>
</html>
