<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Griddy · chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="phone">
  <header class="phone-top">
    <h1>Chat</h1>
    <p class="cap">A real model on the demo Mac, served under the dispatcher. Each reply shows its time to first token and total time, measured by the server.</p>
    <div class="src" id="model">model: asking the server</div>
  </header>

  <main>
    <ol id="thread" class="thread"><li class="empty">Say something. The reply appears as the model writes it.</li></ol>
    <form id="form" class="composer">
      <textarea id="msg" aria-label="message to the chat service" rows="2" placeholder="Ask anything" maxlength="2000" required></textarea>
      <button id="send" class="primary" type="submit">Send</button>
    </form>
  </main>

  <script src="common.js"></script>
  <script src="chat.js"></script>
</body>
</html>
