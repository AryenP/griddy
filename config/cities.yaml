# The city a judge opens from the 3D world (web/world.js): the real city of each grid's emergencies. Hospital places
# (scripts/fetch_city.py) and one square of the city drawn 1:1, its buildings, heights, streets and mapped power lines
# (scripts/fetch_city_map.py, `map` below), are REAL OpenStreetMap data (ODbL) saved in docs/evidence/city/; the grid's
# numbers on the map are the replay's or the live feed's. Which blocks go dark, and the feeders' routing, are
# illustrative, and the page says so: no public source lists these cities' feeders.
cities:
  - id: houston
    name: Houston
    iso: ERCOT                 # Uri's worst outages: CenterPoint's area (FERC-NERC report, Nov 2021)
    viewbox: [-95.60, 29.95, -95.20, 29.60]     # west, north, east, south
    map:                       # the 1:1 square drawn in the 3D city view (scripts/fetch_city_map.py)
      name: Texas Medical Center
      center: [29.7075, -95.3990]
      half_m: 600
  - id: san-francisco
    name: San Francisco
    iso: CAISO                 # Cal Hacks is here; its load pays PG&E's default load price, DLAP_PGAE (config/isos.yaml)
    viewbox: [-122.52, 37.81, -122.35, 37.70]
    map:
      name: Mission District, from PG&E's Mission substation to SF General
      center: [37.7662, -122.4085]
      half_m: 1200
