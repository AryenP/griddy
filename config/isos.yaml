# Grid feeds. All keyless via gridstatus (verified 23 Oct 2026 from the venue).
default: CAISO
isos:
  CAISO:
    timezone: US/Pacific
    lmp_market: REAL_TIME_5_MIN
    day_ahead_market: DAY_AHEAD_HOURLY
    locations: [DLAP_PGAE-APND, TH_NP15_GEN-APND, TH_SP15_GEN-APND]   # PG&E's default load price, which San Francisco's load
                              # pays (the demo's city); the NorCal and SoCal trading hubs beside it
    poll_s: {lmp: 300, forecast: 1800, fuel_mix: 300}
    area: California (CAISO)  # what the Grid view's city stands for live: the load CAISO serves, not one city
    places:                   # a fuel gets a plant's name only where that plant IS the whole number (web/world.js)
      Nuclear: {name: Diablo Canyon, note: "California's only nuclear plant",
                source: "NRC, List of Power Reactor Units (reviewed 14 Sep 2026): Diablo Canyon 1 and 2 are the only units in CA"}
  ERCOT:
    offered: false            # Aryen, Sun 03:00: Texas leaves the demo (Uri now replays as a San Francisco simulation)
    timezone: US/Central
    lmp_market: REAL_TIME_15_MIN
    day_ahead_market: DAY_AHEAD_HOURLY
    locations: [HB_HOUSTON, HB_NORTH]
    poll_s: {lmp: 900, forecast: 1800, fuel_mix: 300, system_conditions: 60}
    alert_rules: {frequency_low_hz: 59.9}
    area: Texas (ERCOT)
    places:
      Nuclear: {name: Comanche Peak and South Texas, note: "Texas's two nuclear plants",
                source: "NRC, List of Power Reactor Units (reviewed 14 Sep 2026): Comanche Peak 1-2 and South Texas 1-2 are the only units in TX"}
  PJM:                      # Data Miner needs a free API key: set PJM_API_KEY in .env or PJM is not offered
    timezone: US/Eastern
    lmp_market: REAL_TIME_5_MIN
    day_ahead_market: DAY_AHEAD_HOURLY
    locations: hubs
    poll_s: {lmp: 300, forecast: 1800, fuel_mix: 300}
# Emission factors, gCO2-eq per kWh generated, used to turn the live fuel mix into carbon intensity.
# Source (all but the last four rows): IPCC AR5 WGIII (2014), Annex III, Table A.III.2, lifecycle
#   emissions, median values (Schloemer et al., "Technology-specific Cost and Performance Parameters").
#   https://www.ipcc.ch/site/assets/uploads/2018/02/ipcc_wg3_ar5_annex-iii.pdf
# Source (Imports, Other): CARB Mandatory GHG Reporting Regulation (17 CCR §95111(b)(1)), default
#   emission factor for unspecified electricity imports, 0.428 tCO2e/MWh = 428 g/kWh (combustion, not
#   lifecycle; the closest published number for power of unknown origin in CAISO).
# Storage discharges energy generated earlier; it is not generation and carries 0 here.
emission_factors_gco2_per_kwh:
  Natural Gas: 490        # IPCC AR5: gas, combined cycle (median)
  Coal: 820               # IPCC AR5: coal, pulverised (median)
  Coal and Lignite: 820   # ERCOT name; IPCC AR5 coal, pulverised (median)
  Nuclear: 12             # IPCC AR5: nuclear (median)
  Solar: 48               # IPCC AR5: solar PV, utility scale (median); CAISO/ERCOT solar is mostly utility scale
  Wind: 11                # IPCC AR5: wind onshore (median)
  Geothermal: 38          # IPCC AR5: geothermal (median)
  Biomass: 230            # IPCC AR5: biomass, dedicated (median)
  Biogas: 230             # IPCC AR5 has no biogas row; biomass, dedicated (median) used
  Hydro: 24               # ERCOT name; IPCC AR5 hydropower (median)
  Small Hydro: 24         # IPCC AR5: hydropower (median)
  Large Hydro: 24         # IPCC AR5: hydropower (median)
  Imports: 428            # CARB unspecified-import default (see above); mix unknown, labelled as such
  Other: 428              # CARB unspecified-import default (see above); source unknown
  Batteries: 0            # storage, not generation (see above)
  Power Storage: 0        # ERCOT name for batteries; storage, not generation
