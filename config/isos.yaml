# Grid feeds. All keyless via gridstatus (verified 23 Oct 2026 from the venue).
default: CAISO
isos:
  CAISO:
    timezone: US/Pacific
    lmp_market: REAL_TIME_5_MIN
    day_ahead_market: DAY_AHEAD_HOURLY
    locations: [TH_SP15_GEN-APND, TH_NP15_GEN-APND]   # trading hubs: SoCal, NorCal
    poll_s: {lmp: 300, forecast: 1800, fuel_mix: 300}
  ERCOT:
    timezone: US/Central
    lmp_market: REAL_TIME_15_MIN
    day_ahead_market: DAY_AHEAD_HOURLY
    locations: [HB_HOUSTON, HB_NORTH]
    poll_s: {lmp: 900, forecast: 1800, fuel_mix: 300, system_conditions: 60}
    alert_rules: {frequency_low_hz: 59.9}
  PJM:                      # Data Miner needs a free API key: set PJM_API_KEY in .env or PJM is not offered
    timezone: US/Eastern
    lmp_market: REAL_TIME_5_MIN
    day_ahead_market: DAY_AHEAD_HOURLY
    locations: hubs
    poll_s: {lmp: 300, forecast: 1800, fuel_mix: 300}
# Emission factors, gCO2 per kWh generated, used to turn the live fuel mix into carbon intensity.
# Source: cite the exact table used (e.g., EPA eGRID 2023 or IPCC lifecycle medians) in DECISIONS.md before demo.
emission_factors_gco2_per_kwh:
  Natural Gas: 410
  Coal: 820
  Coal and Lignite: 820   # ERCOT name
  Hydro: 24               # ERCOT name
  Power Storage: 0        # ERCOT name for batteries; label as "stored"
  Nuclear: 12
  Solar: 41
  Wind: 11
  Geothermal: 38
  Biomass: 230
  Biogas: 230
  Small Hydro: 24
  Large Hydro: 24
  Batteries: 0        # label as "stored"; attribute upstream mix if time
  Imports: 400        # unknown mix; label as assumption
  Other: 400
