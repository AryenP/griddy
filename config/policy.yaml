# Replace owners/never_pause/approvals with what the Microsoft FDEs or an operator say on Saturday.
objective: balanced            # cost | carbon | balanced
weights: {cost: 0.5, carbon: 0.5, lateness_penalty: 1000}
power_cap_w: null              # set by CapEvents at runtime
# Chat SLA on time to first token (replies stream to the user). Set from `make chat-sweep`
# (2026-10-24 00:18-00:22, M2 Pro, qwen3:4b-instruct): worst TTFT p95 0.29 s idle, 0.24 s with training
# on the GPU, concurrency 1-4, 64-256 tokens. 1.0 s leaves >3x headroom. Total latency is reported, not an
# SLA: reply length / ~31-52 tok/s per stream (5.0-15.7 s p95 for 256 tokens).
sla: {chat_ttft_p95_s: 1.0}
never_pause: [chat]
approvals:
  deadline_slip: owner
  chat_degrade: operator
  chat_pause: operator
operator: ops
slot_minutes: 15
horizon_hours: 24
solver_time_limit_s: 2
# Re-solve when measured reality drifts from the plan (SPEC §5), at most once per min_interval_s.
# Watts drift = |measured 60 s mean - planned| > max(watts_drift_pct % of planned, watts_drift_min_w).
replan: {chat_busy_delta: 0.5, watts_drift_pct: 20, watts_drift_min_w: 2.0, min_interval_s: 60}
