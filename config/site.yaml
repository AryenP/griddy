# Shown on the dashboard. Fill `quote` with the operator/FDE quote collected at the Sat 10 AM
# Microsoft workshop, with permission; the header shows nothing until it is filled.
quote: null        # {text: "...", who: "Name", role: "Title, Org"}

# At grid scale: an ESTIMATE, labelled so on the pages (Aryen, Sat 13:20: "public data sets"; Sun 03:00: no Texas).
# Live: the grid's demand served now (its fuel mix, the same total the Grid page shows). Stated: a unit of data center
# load, 1 GW, because CAISO publishes no running-data-center figure we can cite (the replays of California use the same).
# The cut is this Mac's measured one under the same call (evidence of record, DECISIONS 09:46: Brownout 14.34 W
# vs ignore the call 20.85 W). A laptop's response is not a data center's: the page says "if".
scale:
  poll_s: 60
  flexible_mw: 1000
  flexible_source: "a rate per 1 GW of data centers: no fleet total is assumed"
  our_cut_pct: 31.2
  our_cut_source: "this Mac, evidence of record (DECISIONS 09:46): 14.34 W vs 20.85 W under the same call"
